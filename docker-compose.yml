services:
  urlshortener.api:
    image: ${DOCKER_REGISTRY-}urlshortenerapi
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data

  urlshortener.ui:
    image: ${DOCKER_REGISTRY-}urlshortenerui
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"   # nginx listens on 80 inside the container
    depends_on:
      - urlshortener.api
